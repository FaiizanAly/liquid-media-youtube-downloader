<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Media</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window-container">
    <!-- Header: macOS App Header with Brand & Status -->
    <header class="app-header glass-header">
      <div class="brand-row">
        <div class="brand-identity">
          <div class="app-icon-wrapper">
            <svg class="liquid-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="liquidGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#0A84FF" />
                  <stop offset="100%" stop-color="#0062C4" />
                </linearGradient>
                <linearGradient id="innerShine" x1="6" y1="4" x2="18" y2="20" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
                  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#liquidGrad)" />
              <path d="M12 5C9 8.5 7 11 7 13.5C7 16.5 9.2 19 12 19C14.8 19 17 16.5 17 13.5C17 11 15 8.5 12 5Z" fill="url(#innerShine)" />
              <polygon points="11,11 15,13.5 11,16" fill="#004D99" />
            </svg>
          </div>
          <div class="brand-titles">
            <span class="app-title">Liquid Media</span>
            <span class="app-tagline">macOS Native Glass</span>
          </div>
        </div>

        <!-- Companion / Engine status pill -->
        <div class="status-indicator-pill" id="companionStatusPill" title="Companion connection status">
          <span class="status-dot dot-checking" id="statusDot"></span>
          <span class="status-label" id="statusLabel">Checking...</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-body">
      <!-- Media Source Display Card -->
      <section id="sourceContainer" class="source-section" aria-label="Detected Media Source">
        <!-- Rendered dynamically by popup.js -->
      </section>

      <!-- Segmented Tab Switcher (macOS segmented pill) -->
      <nav class="tab-bar-container" id="tabBar" role="tablist">
        <button type="button" class="tab-button active" id="tabVideo" role="tab" aria-selected="true" aria-controls="formatList">
          <span class="tab-icon">🎬</span>
          <span class="tab-text">Video Downloads</span>
        </button>
        <button type="button" class="tab-button" id="tabAudio" role="tab" aria-selected="false" aria-controls="formatList">
          <span class="tab-icon">🎵</span>
          <span class="tab-text">Audio Only</span>
        </button>
      </nav>

      <!-- Active Downloads Progress Panel (if any) -->
      <section id="activeDownloadsContainer" class="active-downloads-section" style="display: none;" aria-live="polite">
        <!-- In-progress download cards inserted here -->
      </section>

      <!-- Formats List Container -->
      <section id="formatListSection" class="format-list-section">
        <div id="formatList" class="format-list" role="region" aria-live="polite">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Companion Service Notice (if offline on YouTube page) -->
      <section id="companionNoticeContainer" style="display: none;"></section>
    </main>

    <!-- Footer: Engine status & Controls -->
    <footer class="app-footer glass-footer">
      <div class="footer-left">
        <span class="footer-version">v1.0.0</span>
        <span class="footer-divider">•</span>
        <span class="footer-mode" id="footerModeText">Direct Engine Ready</span>
      </div>
      <div class="footer-right">
        <button type="button" class="btn-refresh" id="btnRefresh" title="Refresh Page Sources" aria-label="Refresh Formats">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
            <path d="M8 2.5a5.5 5.5 0 0 1 5.3 4H14.5a6.5 6.5 0 1 0-1.8 5.7l-.8-.8A5.4 5.4 0 1 1 8 2.5zm4.8 1.8V7h-2.7l1.3-1.3-1.4-1.4z"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Extension Scripts -->
  <script src="js/validators.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
